apiVersion: v1
kind: Service
metadata:
  name: embedded-cluster-dr
  labels:
    {{- include "embedded-cluster-dr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "embedded-cluster-dr.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

