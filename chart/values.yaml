image:
  repository: ghcr.io/replicatedhq/embedded-cluster-disaster-recovery
  # Defaults to the chart appVersion, which the release workflow sets from the
  # release tag. Set this only to deploy a different controller version.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: embedded-cluster-dr

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # age's default scrypt work factor requires about 256 MiB by itself while
    # encrypting and decrypting the EC state archive. Leave headroom for the
    # controller and S3 client so backup/restore cannot be OOM-killed mid-run.
    memory: 512Mi

velero:
  fullnameOverride: velero
  image:
    repository: docker.io/velero/velero
    tag: v1.18.2
  initContainers:
    - name: velero-plugin-for-aws
      image: docker.io/velero/velero-plugin-for-aws:v1.14.2
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins
  credentials:
    useSecret: false
  backupsEnabled: false
  snapshotsEnabled: false
  deployNodeAgent: true
  nodeAgent:
    # EC exposes the configured k0s kubelet root through this stable symlink,
    # independent of the installation's selected data directory.
    podVolumePath: /var/lib/ec/kubelet/pods
    pluginVolumePath: /var/lib/ec/kubelet/plugins
  configuration:
    defaultVolumesToFsBackup: true
    extraEnvVars:
      - name: HTTP_PROXY
        valueFrom:
          secretKeyRef:
            name: embedded-cluster-dr-proxy
            key: HTTP_PROXY
            optional: true
      - name: HTTPS_PROXY
        valueFrom:
          secretKeyRef:
            name: embedded-cluster-dr-proxy
            key: HTTPS_PROXY
            optional: true
      - name: NO_PROXY
        value: 127.0.0.1,localhost,.svc,.cluster.local
  rbac:
    create: true
    clusterAdministrator: true
  metrics:
    serviceMonitor:
      enabled: false
      autodetect: false
